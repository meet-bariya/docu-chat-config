apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docu-chat
  labels:
    app.kubernetes.io/name: docu-chat
spec:
  ingressClassName: nginx
  rules:
    - host: docu-chat.local
      http:
        paths:
          # Backend API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          # Frontend API
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
